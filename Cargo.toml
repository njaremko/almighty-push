[package]
name = "almighty-push"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Safely reconcile a jj change stack with stacked GitHub pull requests"
license = "MIT"
repository = "https://github.com/njaremko/almighty-push"
homepage = "https://github.com/njaremko/almighty-push"
readme = "README.md"
keywords = ["jujutsu", "jj", "github", "pull-request", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
